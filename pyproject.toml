[project]
name = "pdf-audiobook-studio"
version = "0.3.9.1"
description = "Privacy-first local book translation and audiobook production studio"
requires-python = ">=3.10,<3.14"
dependencies = [
    "streamlit>=1.49,<2",
    "PyMuPDF>=1.28,<2",
    "kokoro-onnx>=0.6.1,<1",
    "soundfile>=0.13,<1",
    "numpy>=2,<3",
    "imageio-ffmpeg>=0.6,<1",
    "EbookLib>=0.19,<1",
    "beautifulsoup4>=4.13,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
